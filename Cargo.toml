[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/bin"]

[workspace.package]
version = "0.0.0"
edition = "2024"

[profile.release]
debug = false
strip = true

[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release-lto"
debug = true
strip = false

[workspace.dependencies]
stdx = { path = "crates/stdx" }
crossbeam-channel = "*"
windows-sys = { version = "*", features = ["Win32_System_Console"] }
